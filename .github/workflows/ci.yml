name: CI

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu -q
          pip install -r requirements.txt pytest ruff -q
      - name: Lint
        run: ruff check . --select E,F --ignore E501
      - name: Tests de l'equipe
        env:
          LLM_PROVIDER: fake
        run: pytest tests/ --ignore=tests/test_auto_eval.py -v --tb=short
